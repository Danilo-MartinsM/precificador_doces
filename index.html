<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Precificador Pura Doçura</title>
  <style>
  :root{
  --brown:#6b3e26;
  --gold:#d4af37;
  --light-gold:#f3e9d2;
  --white:#fff;
  --muted:#fcf9f7;
}

body{
  font-family:'Inter',Arial,sans-serif;
  margin:0;
  background:var(--muted);
  color:#3a2b26;
  padding:0;
}

header{
  background:var(--brown);
  color:var(--white);
  padding:14px 20px;
  text-align:center;
  font-size:1.4rem;
  font-weight:600;
  letter-spacing:0.5px;
}

.wrap{
  max-width:1200px;
  margin:20px auto;
  display:grid;
  grid-template-columns:1fr 340px;
  gap:20px;
  padding:0 16px;
}

.card{
  background:var(--white);
  padding:16px 18px;
  border-radius:12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.06);
}

h2,h3{
  margin:0 0 12px 0;
  color:var(--brown);
  font-size:1.25rem;
}

label{
  display:block;
  font-size:14px;
  margin:8px 0 4px;
  color:#5a463a;
}

input,select{
  padding:9px 10px;
  border-radius:8px;
  border:1px solid #e7ded8;
  width:100%;
  font-size:14px;
  box-sizing:border-box;
}

.btn{
  background:var(--brown);
  color:var(--white);
  padding:9px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-size:14px;
  transition:background 0.2s, transform 0.1s;
}

.btn:hover{
  background:#5a311c;
  transform:scale(1.02);
}

.small{
  background:#f5e9e2;
  border:1px solid #dec5b5;
  color:#543a2d;
  padding:6px 8px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
}

.small:hover{
  background:#f1e1d6;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:8px;
  font-size:14px;
}

th,td{
  padding:8px 10px;
  border-bottom:1px dashed #eee1da;
  text-align:left;
}

th{
  background:#faf6f4;
  color:#5c4638;
  font-weight:600;
}

.inline{
  display:flex;
  gap:10px;
}

hr{
  border:none;
  border-top:1px solid #f0e6df;
  margin:14px 0;
}

.info{
  margin-top:14px;
  font-size:15px;
  color:#3a2b26;
}

.info span{
  font-weight:600;
  color:var(--brown);
}

#recipesList .card{
  margin-bottom:10px;
}

@media(max-width:980px){ .wrap{ grid-template-columns:1fr; } }
@media(max-width:680px){
  header{ font-size:1.2rem; padding:12px; }
  .inline{ flex-direction:column; gap:6px; }
  input, select, .btn, .small{ font-size:15px; width:100%; }
  table{ display:block; overflow-x:auto; white-space:nowrap; font-size:13px; }
  th,td{ padding:7px; }
}
@media(max-width:420px){ h2{ font-size:1.1rem; } label{ font-size:12px; } }

/* Cards receitas */
.recipe-card {
  background: var(--light-gold);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  transition: transform 0.15s;
}

.recipe-card:hover {
  transform: translateY(-2px);
}

.recipe-card h3 {
  margin: 0 0 6px 0;
  color: var(--brown);
  font-size: 1.15rem;
}

.recipe-card .meta {
  font-size: 13px;
  color: #5c4638;
  margin-bottom: 8px;
}

.recipe-card ul {
  margin: 0;
  padding-left: 16px;
}

.recipe-card li {
  margin-bottom: 4px;
}

.recipe-card .costs {
  margin-top: 8px;
  font-weight: 600;
  color: var(--brown);
  display: flex;
  justify-content: space-between;
}

.recipe-card .actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.recipe-card .actions button {
  font-size: 13px;
  padding: 5px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.recipe-card .actions .edit-btn {
  background: #ffd966;
  color: #5a463a;
}

.recipe-card .actions .edit-btn:hover {
  background: #f9d24a;
  transform: scale(1.05);
}

.recipe-card .actions .delete-btn {
  background: #e57373;
  color: #fff;
}

.recipe-card .actions .delete-btn:hover {
  background: #d64545;
  transform: scale(1.05);
}

/* Select2 igual aos inputs (estilo da primeira página) */
.select2-container--default .select2-selection--single {
  background-color: #fff;
  border: 1px solid #e7ded8;
  border-radius: 8px;
  height: 38px;
  padding: 0 10px;
  font-size: 14px;
  color: #3a2b26;
  display: flex;
  align-items: center;
  box-sizing: border-box;
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
  line-height: 38px;
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
  height: 38px;
  right: 10px;
}

.select2-container--default .select2-selection--single .select2-selection__clear {
  height: 38px;
}

.select2-container--default .select2-dropdown {
  border-radius: 8px;
  border: 1px solid #e7ded8;
  background: #fff;
}

.select2-container--default .select2-results__option--highlighted {
  background-color: #f3e9d2;
  color: #3a2b26;
}
/* Select2 igual aos inputs */
.select2-container--default .select2-selection--single {
    height: 38px !important;
    border-radius: 8px;
    border: 1px solid #e7ded8;
    background-color: #fff;
    display: flex;
    align-items: center; /* centraliza o texto verticalmente */
    padding: 0 10px !important; /* remove padding vertical extra */
    box-sizing: border-box;
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 38px !important; /* força centralização vertical */
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 38px !important; /* mesma altura da caixa */
    right: 10px !important;
}

.select2-container--default .select2-selection--single .select2-selection__clear {
    height: 38px !important;
}

.select2-container--default .select2-dropdown {
    border-radius: 8px;
    border: 1px solid #e7ded8;
    background: #fff;
}

  </style>
  <!-- jQuery necessário para Select2 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


</head>
<body>
  <header>
      🍫 Precificador Pura Doçura
      <nav>
          <a href="produtos.html">
              <button class="btn" id="btnProdutos" style="margin-left:12px;">
              🛒 Produtos
              </button>
          </a>
      </nav>
  </header>

  <div class="wrap">
    <!-- Formulário de nova receita -->
    <main class="card">
      <h2>Nova Receita</h2>

      <label>Categoria</label>
      <select id="categoria">
        <option>Bolos</option>
        <option>Brigadeiros</option>
        <option>Doces</option>
      </select>

      <label>Nome da Receita</label>
      <input id="nomeDoce" type="text" placeholder="Ex: Bolo de Cenoura">

      <div class="inline" style="margin-top:8px;align-items:end">
        <div style="flex:1">
          <label>Ingrediente</label>
          <select id="ingredSelect" style="height: 38px;"></select>
        </div>
        <div style="flex:1">
          <label>Quantidade</label>
          <input id="qtdIng" type="number" step="any" placeholder="Ex: 200">
        </div>
        <div style="flex:1">
          <label>Unidade</label>
          <select id="unitIng">
            <option value="g">g</option>
            <option value="ml">ml</option>
            <option value="unit">unidade</option>
          </select>
        </div>
        <button class="btn" id="addIng" style="margin-bottom: 3px;">Adicionar</button>
      </div>

      <table id="tbl">
        <thead><tr><th>Ingrediente</th><th>Qtd</th><th>Unid.</th><th>Custo</th><th></th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="inline" style="margin-top:14px;align-items:center">
        <div style="flex:1">
          <label>Embalagem (R$)</label><input id="emb" type="number" step="any" value="0">
        </div>
        <div style="flex:1">
          <label>Margem (%)</label><input id="marg" type="number" step="any" value="50">
        </div>
        <div style="flex:1">
          <label>Peso por unidade (g)</label>
          <input id="pesoUnidade" type="number" step="any" value="100">
        </div>

        <div>
          <button class="btn" id="btnSaveRecipe" style="margin-top: 25px;">Salvar Receita</button>
        </div>
      </div>

      <div class="info">
        <div><strong>Custo total:</strong> <span id="cost">R$ 0,00</span></div>
        <div><strong>Preço por grama:</strong> <span id="price">R$ 0,00</span></div>
      </div>

      <hr>
      <h2>Receitas Salvas</h2>
      <div id="recipesList">Carregando...</div>
    </main>

    <!-- Painel de ingredientes -->
    <aside class="card">
      <h2>Adicionar / Editar Ingrediente</h2>
      <label>Nome</label><input id="formName" type="text" placeholder="Ex: Açúcar refinado">
      <label>Qtd. base</label><input id="formAmount" type="number" step="any" value="100">
      <label>Unidade</label>
      <select id="formUnit"><option value="g">g</option><option value="ml">ml</option><option value="unit">unidade</option></select>
      <label>Preço p/ qtd base (R$)</label><input id="formPrice" type="number" step="any" value="1.00">
      <label>Densidade (g/ml ou g/un)</label><input id="formDensity" type="number" step="any" value="1">

      <div class="inline" style="margin-top:8px">
        <button class="btn" id="btnAddIngDb">Salvar Ingrediente</button>
        <button class="small" id="btnClearForm">Limpar</button>
      </div>

      <hr>
      <h2>Ingredientes Cadastrados</h2>
      <div id="ingList">Carregando...</div>
    </aside>

  </div>

  <script>
    const API = "http://localhost:8000";
    let catalog = [], recipe = [];
    let editingRecipeId = null;

    // =====================
    // FUNÇÕES DE API
    // =====================
    async function fetchIngredients() {
      const res = await fetch(API + "/ingredientes");
      catalog = await res.json();
      renderCatalog();
    }

    async function fetchRecipes() {
      const res = await fetch(API + "/receitas");
      const data = await res.json();
      renderRecipesList(data);
    }

    async function saveIngredient(payload, id=null) {
      if (id) {
        await fetch(`${API}/ingredientes/${id}`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
      } else {
        await fetch(`${API}/ingredientes`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
      }
      clearForm();
      await fetchIngredients();
    }

    async function removeIngredient(id) {
      if (!confirm("Remover ingrediente do banco?")) return;
      await fetch(`${API}/ingredientes/${id}`, { method: "DELETE" });
      await fetchIngredients();
      renderRecipeTable();
    }

    async function saveRecipe(payload, id=null) {
      let res;
      if (id) {
        res = await fetch(`${API}/receitas/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } else {
        res = await fetch(`${API}/receitas`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      }
      return res;
    }

    async function deleteRecipeAPI(id) {
      if (!confirm("Deseja realmente excluir esta receita?")) return;
      const res = await fetch(`${API}/receitas/${id}`, { method: "DELETE" });
      return res.ok;
    }

    // =====================
    // CÁLCULOS
    // =====================
    function convertUnits(value, from, to, density) {
      const v = Number(value) || 0;
      if (from === to) return v;
      if (from === "ml" && to === "g") return v * (Number(density) || 1);
      if (from === "g" && to === "ml") return v / (Number(density) || 1);
      return null;
    }

    function calcCostForItem(it) {
      const item = catalog.find(c => c.id === it.ingrediente_id);
      if (!item) return 0;
      let conv;
      if (it.unidade === "unit" && item.unit === "unit") conv = it.quantidade;
      else if (it.unidade === "unit" && item.unit !== "unit") conv = it.quantidade * Number(item.amount);
      else conv = convertUnits(it.quantidade, it.unidade, item.unit, item.density);
      if (conv === null || isNaN(conv)) return 0;
      return (conv / Number(item.amount)) * Number(item.price);
    }

    function calcTotalCost() {
      let sum = 0;
      recipe.forEach(it => sum += calcCostForItem(it));
      const embV = Number(emb.value) || 0;
      const margV = Number(marg.value) || 0;
      const pesoPorUnidade = Number(pesoUnidade.value) || 100;
      const total = sum;
      const totalComMargem = (total + embV) * (1 + margV / 100);
      const precoPorGrama = totalComMargem / pesoPorUnidade;
      return { total, totalComMargem, precoPorGrama };
    }

    // =====================
    // RENDERIZAÇÃO
    // =====================
    function renderCatalog() {
      const sel = document.getElementById("ingredSelect");
      sel.innerHTML = "";
      const listDiv = document.getElementById("ingList");
      listDiv.innerHTML = "";

      catalog.forEach(i => {
        const opt = document.createElement("option");
        opt.value = i.id;
        opt.textContent = i.nome;
        sel.appendChild(opt);

        const div = document.createElement("div");
        div.style.display = "flex";
        div.style.justifyContent = "space-between";
        div.style.alignItems = "center";
        div.style.marginBottom = "8px";
        div.innerHTML = `<div>${i.nome} <small style="color:#7c5c47">(${i.amount}${i.unit} → R$ ${Number(i.price).toFixed(2)})</small></div>`;

        const right = document.createElement("div");
        right.style.display = "flex";
        right.style.gap = "6px";
        const btnE = document.createElement("button");
        btnE.textContent = "Editar";
        btnE.className = "small";
        btnE.onclick = () => loadIntoForm(i);
        const btnD = document.createElement("button");
        btnD.textContent = "Excluir";
        btnD.className = "small";
        btnD.onclick = () => removeIngredient(i.id);
        right.appendChild(btnE);
        right.appendChild(btnD);
        div.appendChild(right);
        listDiv.appendChild(div);
      });
    }

    function renderRecipeTable() {
      const tbody = document.querySelector("#tbl tbody");
      tbody.innerHTML = "";
      recipe.forEach((it, idx) => {
        const cost = calcCostForItem(it);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${it.nome}</td><td>${it.quantidade}</td><td>${it.unidade}</td><td>R$ ${Number(cost).toFixed(2)}</td><td><button class="small" data-i="${idx}">Remover</button></td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll("button[data-i]").forEach(b => {
        b.addEventListener("click", e => {
          const i = Number(e.target.dataset.i);
          recipe.splice(i, 1);
          renderRecipeTable();
        });
      });

      const costs = calcTotalCost();
      cost.textContent = "R$ " + (costs.total + (Number(emb.value)||0)).toFixed(2);
      price.textContent = "R$ " + costs.precoPorGrama.toFixed(2);
    }

    function renderRecipesList(data) {
      const div = document.getElementById("recipesList");
      div.innerHTML = "";
      if (data.length === 0) { div.textContent = "Nenhuma receita cadastrada"; return; }

      data.forEach(r => {
        const card = document.createElement("div");
        card.className = "recipe-card";

        let html = `<h3>${r.nome}</h3>
                    <div class="meta">Categoria: ${r.categoria || "Sem categoria"} | Peso/unidade: ${r.peso_por_unidade || 100} g</div>
                    <div class="costs">
                      <span>Custo total: R$ ${Number(r.custo_total).toFixed(2)}</span>
                      <span>Preço/g: R$ ${(Number(r.preco_por_unidade)).toFixed(2)}</span>
                    </div>
                    <strong>Ingredientes:</strong>
                    <ul>`;
        r.itens.forEach(i => html += `<li>${i.quantidade} ${i.unidade} de ${i.nome}</li>`);
        html += "</ul>";
        html += `<div class="actions">
                    <button class="edit-btn">Editar</button>
                    <button class="delete-btn">Excluir</button>
                </div>`;
        card.innerHTML = html;
        div.appendChild(card);

        const [editBtn, deleteBtn] = card.querySelectorAll(".actions button");
        editBtn.addEventListener("click", () => editRecipe(r));
        deleteBtn.addEventListener("click", async () => {
          if(await deleteRecipeAPI(r.id)) fetchRecipes();
        });
      });
    }

    // =====================
    // EDIÇÃO DE RECEITA
    // =====================
    function editRecipe(r) {
      editingRecipeId = r.id;
      nomeDoce.value = r.nome;
      categoria.value = r.categoria;
      pesoUnidade.value = r.peso_por_unidade;
      emb.value = r.embalagem || 0;
      marg.value = r.margem || 50;
      recipe = [...r.itens];
      renderRecipeTable();
      btnSaveRecipe.textContent = "Atualizar Receita";
    }

    // =====================
    // EVENTOS
    // =====================
    document.getElementById("addIng").addEventListener("click", () => {
      const id = Number(ingredSelect.value);
      const nome = catalog.find(c => c.id===id)?.nome || "";
      const q = Number(qtdIng.value) || 0;
      const u = unitIng.value;
      recipe.push({ingrediente_id:id, nome, quantidade:q, unidade:u});
      renderRecipeTable();
    });

    document.getElementById("btnSaveRecipe").addEventListener("click", async () => {
      const nomeR = nomeDoce.value.trim();
      if (!nomeR) return alert("Informe o nome da receita!");
      if (recipe.length === 0) return alert("Adicione ao menos um ingrediente!");

      const costs = calcTotalCost();
      const payload = {
        nome: nomeR,
        categoria: categoria.value,
        peso_por_unidade: Number(pesoUnidade.value)||100,
        custo_total: costs.total + Number(emb.value)||0,
        preco_por_unidade: costs.precoPorGrama,
        itens: recipe
      };

      if (editingRecipeId) {
        await saveRecipe(payload, editingRecipeId);
        editingRecipeId = null;
        btnSaveRecipe.textContent = "Salvar Receita";
      } else {
        await saveRecipe(payload);
      }

      recipe = [];
      renderRecipeTable();
      nomeDoce.value="";
      await fetchRecipes();
    });

    function loadIntoForm(item) {
      formName.value = item.nome;
      formAmount.value = item.amount;
      formUnit.value = item.unit;
      formPrice.value = item.price;
      formDensity.value = item.density;
      btnAddIngDb.dataset.editing = item.id; // CORRIGIDO
    }

    function clearForm() {
      formName.value = formAmount.value = formPrice.value = formDensity.value = "";
      formUnit.value = "g";
      delete btnAddIngDb.dataset.editing;
    }

    document.getElementById("btnAddIngDb").addEventListener("click", () => {
      const payload = {
        nome: formName.value,
        amount: Number(formAmount.value)||100,
        unit: formUnit.value,
        price: Number(formPrice.value)||0,
        density: Number(formDensity.value)||1
      };
      const editId = btnAddIngDb.dataset.editing;
      saveIngredient(payload, editId ? Number(editId):null);
    });

    document.getElementById("btnClearForm").addEventListener("click", clearForm);

    // Inicializa Select2 para o select de ingredientes
    function initSelect2() {
      $('#ingredSelect').select2({
        placeholder: "Selecione um ingrediente",
        allowClear: true,
        width: '100%' // garante que ocupe todo o espaço do container
      });
    }

    // Chame após renderizar os ingredientes
    function renderCatalog() {
      const sel = document.getElementById("ingredSelect");
      sel.innerHTML = "";
      const listDiv = document.getElementById("ingList");
      listDiv.innerHTML = "";

      catalog.forEach(i => {
        const opt = document.createElement("option");
        opt.value = i.id;
        opt.textContent = i.nome;
        sel.appendChild(opt);

        const div = document.createElement("div");
        div.style.display = "flex";
        div.style.justifyContent = "space-between";
        div.style.alignItems = "center";
        div.style.marginBottom = "8px";
        div.innerHTML = `<div>${i.nome} <small style="color:#7c5c47">(${i.amount}${i.unit} → R$ ${Number(i.price).toFixed(2)})</small></div>`;

        const right = document.createElement("div");
        right.style.display = "flex";
        right.style.gap = "6px";
        const btnE = document.createElement("button");
        btnE.textContent = "Editar";
        btnE.className = "small";
        btnE.onclick = () => loadIntoForm(i);
        const btnD = document.createElement("button");
        btnD.textContent = "Excluir";
        btnD.className = "small";
        btnD.onclick = () => removeIngredient(i.id);
        right.appendChild(btnE);
        right.appendChild(btnD);
        div.appendChild(right);
        listDiv.appendChild(div);
      });

      // Inicializa/Atualiza Select2 após preencher o select
      initSelect2();
    }


    // =====================
    // INICIALIZAÇÃO
    // =====================
    fetchIngredients();
    fetchRecipes();
  </script>
</body>
</html>
